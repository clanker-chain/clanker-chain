# Mosquitto ACLs for development broker
#
# This file encodes a minimal topic-level authorization model for the
# initial two bots (`france-bot` and `tooter-bot`) described in `bot-comms.md`.
# It is intentionally narrow and should be expanded as you add more bots/channels.
#
# Syntax reference:
#   user <username>
#   topic [read|write] <topic filter>
#
# See `man mosquitto.conf` and `man mosquitto_auth_acl` for details.

######################################################################
# France-bot permissions
######################################################################

user france-bot

# Read its own inbox, status, and metadata
topic read bots/france-bot/#

# Read global announcements and broadcasts
topic read bots/all/#

# Read coordination/tasks in dedicated dm channels where france-bot participates
topic read dm/france-bot-+/#
topic read dm/+-france-bot/#

# Read group channels it is a member of (wildcard for dev)
topic read bots/channels/# 

# Write its own status and metadata
topic write bots/france-bot/status
topic write bots/france-bot/metadata

# Write global announcements (join/leave, broadcasts)
topic write bots/all/announce
topic write bots/all/broadcast

# Write direct messages to other bots' inboxes
topic write bots/+/inbox

# Write to dm channels it participates in
topic write dm/france-bot-+/#
topic write dm/+-france-bot/#

######################################################################
# Tooter-bot permissions
######################################################################

user tooter-bot

# Read its own inbox, status, and metadata
topic read bots/tooter-bot/#

# Read global announcements and broadcasts
topic read bots/all/#

# Read coordination/tasks in dedicated dm channels where tooter-bot participates
topic read dm/tooter-bot-+/#
topic read dm/+-tooter-bot/#

# Read group channels it is a member of (wildcard for dev)
topic read bots/channels/# 

# Write its own status and metadata
topic write bots/tooter-bot/status
topic write bots/tooter-bot/metadata

# Write global announcements (join/leave, broadcasts)
topic write bots/all/announce
topic write bots/all/broadcast

# Write direct messages to other bots' inboxes
topic write bots/+/inbox

# Write to dm channels it participates in
topic write dm/tooter-bot-+/#
topic write dm/+-tooter-bot/#

######################################################################
# Monitoring / observability users (optional)
######################################################################
#
# Example: a `monitor` user that has read-only access to all `bots/#`
# topics. Uncomment and set up credentials in the password file if needed.
#
# user monitor
# topic read bots/#
# topic read monitor/#

