## Mosquitto development broker configuration
##
## This config is intended for local / PoC use only.
## It sets up a single listener on port 1883, requires authentication,
## and applies a simple ACL file that matches the topic layout in `bot-comms.md`.

# Listen on all interfaces on the default MQTT port for dev.
listener 1883 0.0.0.0

# Do not allow anonymous connections; require username/password.
allow_anonymous false

# Password file containing credentials for bots (e.g. france-bot, tooter-bot).
# Generate with:
#   mosquitto_passwd -c config/mosquitto-passwords france-bot
#   mosquitto_passwd  config/mosquitto-passwords tooter-bot
password_file config/mosquitto-passwords

# ACL file controlling which topics each user can read/write.
acl_file config/mosquitto-acl.conf

# Persist client sessions and queued QoS>0 messages across broker restarts.
persistence true
persistence_location data/

# Log to stdout and a file for easier debugging in dev.
log_dest stdout
log_dest file logs/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

