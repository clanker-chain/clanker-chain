name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  pr-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Local CI checks (typecheck/build/tests + tarball validation)
        run: bash ./scripts/ci-local.sh --ci

