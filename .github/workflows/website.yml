name: website

on:
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  push:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/website.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        run: npm ci

      # PUBLIC_PRIVY_APP_ID is optional here. Without it, /join renders a
      # not-configured card (no live Privy login in CI).
      - name: Build
        run: npm run build
