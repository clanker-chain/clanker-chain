name: Identity node client release

on:
  push:
    tags:
      - "identity-node-client-v*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure NPM_TOKEN is configured
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "ERROR: NPM_TOKEN secret is required for npm publish." >&2
            exit 1
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify tag matches package version
        working-directory: packages/identity-node-client
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#identity-node-client-v}"
          PKG_VERSION="$(node -e "console.log(require('./package.json').version)")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)." >&2
            exit 1
          fi

      - name: Install and build
        working-directory: packages/identity-node-client
        run: |
          npm ci
          npm run build

      - name: Check npm version availability
        working-directory: packages/identity-node-client
        run: |
          PKG_NAME="$(node -e "console.log(require('./package.json').name)")"
          PKG_VERSION="$(node -e "console.log(require('./package.json').version)")"
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "ERROR: ${PKG_NAME}@${PKG_VERSION} is already published." >&2
            exit 1
          fi

      - name: Publish package to npm
        working-directory: packages/identity-node-client
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
