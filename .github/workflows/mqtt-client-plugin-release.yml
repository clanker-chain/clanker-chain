name: MQTT client plugin release

on:
  push:
    tags:
      - "mqtt-client-plugin-v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build identity-node-client
        working-directory: identity-node-client
        run: |
          npm ci
          npm run build

      - name: Build mqtt-node-client
        working-directory: mqtt-node-client
        run: |
          npm ci
          npm run build

      - name: Install mqtt-client-plugin deps
        working-directory: mqtt-client-plugin
        run: npm ci

      - name: Create bundle tarball
        run: |
          PLUGIN_NAME="mqtt-client-plugin"
          BUNDLE_DIR="bundle"
          rm -rf "$BUNDLE_DIR"
          mkdir -p "$BUNDLE_DIR/$PLUGIN_NAME"

          # Copy plugin files (include install.sh for one-step install + pnpm lockfile update)
          cp mqtt-client-plugin/package.json mqtt-client-plugin/openclaw.plugin.json mqtt-client-plugin/index.mjs mqtt-client-plugin/install.sh "$BUNDLE_DIR/$PLUGIN_NAME"/
          cp -R mqtt-client-plugin/src "$BUNDLE_DIR/$PLUGIN_NAME"/

          # Copy node_modules (dereference file: deps so tarball is self-contained)
          cp -RL mqtt-client-plugin/node_modules "$BUNDLE_DIR/$PLUGIN_NAME"/

          TAR_NAME="$PLUGIN_NAME-${GITHUB_REF_NAME}.tgz"
          tar -czf "$TAR_NAME" -C "$BUNDLE_DIR" "$PLUGIN_NAME"
          echo "ASSET_PATH=$(pwd)/$TAR_NAME" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: MQTT client plugin ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Upload plugin bundle asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.ASSET_PATH }}
          asset_name: mqtt-client-plugin-${{ github.ref_name }}.tgz
          asset_content_type: application/gzip
