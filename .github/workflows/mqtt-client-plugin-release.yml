name: MQTT client plugin release

on:
  push:
    tags:
      - "mqtt-client-plugin-v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure NPM_TOKEN is configured
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "ERROR: NPM_TOKEN secret is required for npm publish." >&2
            exit 1
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify tag matches package version
        working-directory: mqtt-client-plugin
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#mqtt-client-plugin-v}"
          PKG_VERSION="$(node -e "console.log(require('./package.json').version)")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)." >&2
            exit 1
          fi

      - name: Install mqtt-client-plugin deps
        working-directory: mqtt-client-plugin
        run: npm install

      - name: Validate pack output has extension entry
        working-directory: mqtt-client-plugin
        run: |
          npm pack --dry-run --json > /tmp/mqtt-pack.json
          node - <<'NODE'
          const fs = require("fs");
          const pkg = require("./package.json");
          const pack = JSON.parse(fs.readFileSync("/tmp/mqtt-pack.json", "utf8"));
          const files = new Set((pack[0]?.files ?? []).map((f) => f.path));
          const extensions = pkg?.openclaw?.extensions ?? [];
          if (!extensions.length) {
            throw new Error("No openclaw.extensions entries found.");
          }
          for (const ext of extensions) {
            const rel = ext.replace(/^\.\//, "");
            if (!files.has(rel)) {
              throw new Error(`Packed artifact missing extension entry: ${rel}`);
            }
          }
          NODE

      - name: Check npm version availability
        working-directory: mqtt-client-plugin
        run: |
          PKG_NAME="$(node -e "console.log(require('./package.json').name)")"
          PKG_VERSION="$(node -e "console.log(require('./package.json').version)")"
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "ERROR: ${PKG_NAME}@${PKG_VERSION} is already published." >&2
            exit 1
          fi

      - name: Publish package to npm
        working-directory: mqtt-client-plugin
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create bundle tarball
        run: |
          PLUGIN_NAME="mqtt-client-plugin"
          BUNDLE_DIR="bundle"
          rm -rf "$BUNDLE_DIR"
          mkdir -p "$BUNDLE_DIR/$PLUGIN_NAME"

          cp mqtt-client-plugin/package.json mqtt-client-plugin/openclaw.plugin.json mqtt-client-plugin/index.mjs mqtt-client-plugin/install.sh "$BUNDLE_DIR/$PLUGIN_NAME"/
          cp -R mqtt-client-plugin/src "$BUNDLE_DIR/$PLUGIN_NAME"/
          cp -R mqtt-client-plugin/node_modules "$BUNDLE_DIR/$PLUGIN_NAME/node_modules"

          TAR_NAME="$PLUGIN_NAME-${GITHUB_REF_NAME}.tgz"
          tar -czf "$TAR_NAME" -C "$BUNDLE_DIR" "$PLUGIN_NAME"
          if [ ! -f "$BUNDLE_DIR/$PLUGIN_NAME/index.mjs" ]; then
            echo "ERROR: bundle missing index.mjs required by openclaw.extensions." >&2
            exit 1
          fi
          echo "ASSET_PATH=$(pwd)/$TAR_NAME" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: MQTT client plugin ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Upload plugin bundle asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.ASSET_PATH }}
          asset_name: mqtt-client-plugin-${{ github.ref_name }}.tgz
          asset_content_type: application/gzip
