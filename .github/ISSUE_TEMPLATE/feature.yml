name: Feature request
description: Propose a change or new capability.
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Keep scope tight if possible.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI / operator UX
        - OpenClaw plugins
        - Protocol / identity
        - Hub / mqtt-auth
        - Docs / website
        - other
    validations:
      required: true
