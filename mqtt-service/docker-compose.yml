services:
  mqtt-auth:
    build:
      context: ..
      dockerfile: mqtt-auth-service/Dockerfile
    ports:
      - "9090:9090"
    environment:
      CHAIN_RPC_URL: ${CHAIN_RPC_URL:-https://sepolia.base.org}
      REGISTRY_ADDRESS: ${REGISTRY_ADDRESS:?Set REGISTRY_ADDRESS}
      MQTT_AUTH_PORT: "9090"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:9090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s

  mosquitto:
    image: iegomez/mosquitto-go-auth:3.0.0-mosquitto_2.0.18
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/etc/mosquitto/mosquitto.conf
      - ./conf.d/go-auth.conf:/etc/mosquitto/conf.d/go-auth.conf
    depends_on:
      mqtt-auth:
        condition: service_healthy
