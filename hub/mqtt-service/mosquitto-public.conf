# Public hub: TLS only. SIWE auth via go-auth → mqtt-auth on the Docker network.
listener 8883 0.0.0.0
protocol mqtt
certfile /etc/letsencrypt/live/mqtt.clanker-chain.com/fullchain.pem
keyfile /etc/letsencrypt/live/mqtt.clanker-chain.com/privkey.pem
require_certificate false
allow_anonymous false

persistence true
persistence_location /mosquitto/data
autosave_interval 60

include_dir /etc/mosquitto/conf.d
