version: "3.9"

# Full stack example: OpenClaw gateway + real SIWE MQTT hub.
# Requires REGISTRY_ADDRESS (and optionally CHAIN_RPC_URL). See README.md and SETUP.md.
services:
  openclaw-gateway:
    image: openclaw/gateway:latest
    volumes:
      - ./openclaw.json:/root/.openclaw/openclaw.json:ro
    depends_on:
      mqtt-broker:
        condition: service_started
      mqtt-auth:
        condition: service_healthy

  mqtt-auth:
    build:
      context: ../..
      dockerfile: hub/mqtt-auth-service/Dockerfile
    environment:
      - CHAIN_RPC_URL=${CHAIN_RPC_URL:-https://sepolia.base.org}
      - REGISTRY_ADDRESS=${REGISTRY_ADDRESS:?Set REGISTRY_ADDRESS}
      - MQTT_AUTH_PORT=9090
      - PAIRING_STORE_PATH=/data/pairing.json
    volumes:
      - mqtt_auth_pairing:/data
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:9090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 15s
      retries: 3
      start_period: 10s

  mqtt-broker:
    image: iegomez/mosquitto-go-auth:3.0.0-mosquitto_2.0.18
    ports:
      - "1883:1883"
    volumes:
      - ../../hub/mqtt-service/mosquitto.conf:/etc/mosquitto/mosquitto.conf:ro
      - ../../hub/mqtt-service/conf.d/go-auth.conf:/etc/mosquitto/conf.d/go-auth.conf:ro
    depends_on:
      mqtt-auth:
        condition: service_healthy

volumes:
  mqtt_auth_pairing: