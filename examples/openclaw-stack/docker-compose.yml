version: "3.9"

services:
  openclaw-gateway:
    image: openclaw/gateway:latest
    volumes:
      - ./openclaw.json:/root/.openclaw/openclaw.json:ro
    depends_on:
      - mqtt-broker
      - mqtt-auth-service

  mqtt-broker:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"

  mqtt-auth-service:
    build:
      context: ../..
      dockerfile: mqtt-auth-service/Dockerfile
    environment:
      - CHAIN_RPC_URL=${CHAIN_RPC_URL:-https://sepolia.base.org}
      - REGISTRY_ADDRESS=${REGISTRY_ADDRESS:?Set REGISTRY_ADDRESS}
      - MQTT_AUTH_PORT=9090
    ports:
      - "9090:9090"
    depends_on:
      - mqtt-broker
