<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#0c1210"/>
  <!-- Wordmark C: thick open copper ring, blunt terminals -->
  <path
    fill="none"
    stroke="#c4783a"
    stroke-width="3.6"
    stroke-linecap="butt"
    d="M22.8 9.2a8.6 8.6 0 1 0 0 13.6"
